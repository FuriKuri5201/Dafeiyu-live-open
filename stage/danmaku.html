<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OBS 透明弹幕板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #list {
    position: absolute; bottom: 16px; left: 16px; right: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .item {
    display: inline-flex; align-items: baseline; gap: 8px;
    max-width: 100%; width: fit-content;
    padding: 8px 14px; border-radius: 14px;
    background: rgba(12, 16, 30, 0.78);
    border: 1px solid rgba(56, 189, 248, 0.35);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    color: #f8fafc; font-size: 20px; line-height: 1.4;
    animation: popIn 0.25s ease-out;
  }
  .tag {
    font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
    background: rgba(56, 189, 248, 0.2); color: #38bdf8;
  }
  .tag.bilibili { background: rgba(251, 114, 153, 0.2); color: #fb7299; }
  .tag.test { background: rgba(168, 85, 247, 0.25); color: #c084fc; }
  .user { color: #38bdf8; font-weight: 700; flex-shrink: 0; }
  .text { word-break: break-word; }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(14px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>
<div id="list"></div>
<script>
const list = document.getElementById('list');
const MAX_ITEMS = 12;

function addDanmaku(d) {
  const el = document.createElement('div');
  el.className = 'item';
  const plat = d.platform || 'live';
  const platLabel = plat === 'douyin' ? '抖' : (plat === 'bilibili' ? 'B' : '测');
  el.innerHTML = `<span class="tag ${plat}">${platLabel}</span><span class="user"></span><span class="text"></span>`;
  el.querySelector('.user').textContent = (d.user || '观众') + '：';
  el.querySelector('.text').textContent = d.text || '';
  list.appendChild(el);
  while (list.children.length > MAX_ITEMS) list.removeChild(list.firstChild);
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'danmaku') addDanmaku(msg);
    } catch {}
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
