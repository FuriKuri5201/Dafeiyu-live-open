<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OBS 主播实时字幕</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 24px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #box {
    max-width: 90%;
    padding: 14px 28px; border-radius: 18px;
    background: rgba(10, 14, 28, 0.82);
    border: 2px solid rgba(56, 189, 248, 0.55);
    color: #fff; font-size: 30px; font-weight: 700;
    text-align: center; line-height: 1.45;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.25s, transform 0.25s;
  }
  #box.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div id="box"></div>
<script>
const box = document.getElementById('box');
let hideTimer = null;

function showSubtitle(text, speaking) {
  if (!text) return;
  box.textContent = text;
  box.classList.add('show');
  clearTimeout(hideTimer);
  if (!speaking) {
    hideTimer = setTimeout(() => box.classList.remove('show'), 4500);
  }
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'subtitle') showSubtitle(msg.text, msg.speaking);
    } catch {}
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
