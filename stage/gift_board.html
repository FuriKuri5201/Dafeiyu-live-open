<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OBS 礼物榜</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    padding: 14px;
  }
  .card {
    background: rgba(12, 16, 30, 0.82);
    border: 1.5px solid rgba(244, 114, 182, 0.5);
    border-radius: 16px; padding: 16px 18px; color: #f8fafc;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .title { font-size: 20px; font-weight: 800; color: #f472b6; margin-bottom: 10px; }
  .banner {
    display: none; margin-bottom: 12px; padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(244,114,182,0.28), rgba(168,85,247,0.28));
    border: 1px solid rgba(244,114,182,0.65); font-size: 18px; font-weight: 700;
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); font-size: 16px;
  }
  .row:last-child { border-bottom: none; }
  .rank { color: #fbbf24; font-weight: 800; margin-right: 8px; }
  .empty { color: #94a3b8; font-size: 15px; }
</style>
</head>
<body>
<div class="card">
  <div class="title">🎁 本场礼物贡献榜</div>
  <div id="banner" class="banner"></div>
  <div id="board"><div class="empty">等待第一位老板送礼~</div></div>
</div>
<script>
const boardEl = document.getElementById('board');
const bannerEl = document.getElementById('banner');
let bTimer = null;

function renderBoard(board) {
  const list = (board && board.leaderboard) || [];
  if (!list.length) {
    boardEl.innerHTML = '<div class="empty">等待第一位老板送礼~</div>';
    return;
  }
  boardEl.innerHTML = list.slice(0, 6).map((u, i) => `
    <div class="row">
      <div><span class="rank">#${i + 1}</span><span></span></div>
      <div>${u.count} 个</div>
    </div>
  `).join('');
  [...boardEl.querySelectorAll('.row')].forEach((r, i) => {
    r.querySelectorAll('span')[1].textContent = list[i].user;
  });
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'gift') {
        bannerEl.style.display = 'block';
        bannerEl.textContent = `🎉 感谢 ${msg.user} 送出 ${msg.gift} ×${msg.count}`;
        clearTimeout(bTimer);
        bTimer = setTimeout(() => bannerEl.style.display = 'none', 6000);
        if (msg.board) renderBoard(msg.board);
      } else if (msg.type === 'gift_reset') {
        renderBoard(msg.board);
      }
    } catch {}
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
